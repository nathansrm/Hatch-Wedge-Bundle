# Install deps and compile the Next.js app (parity with `pnpm build` / Dockerfile builder).
# Lint is intentionally omitted until the ESLint backlog is cleared (pnpm lint fails today).
#
# Push/PR CI runs only on the upstream Indie-Kit org repos. Forks and customer clones
# skip the build job automatically (workflow_dispatch still works everywhere).
#
# Actions use Node.js 24-capable majors: actions/checkout@v6, actions/setup-node@v6, pnpm/action-setup@v5.
# Optional: add repository/environment Variables and Secrets (CI_* names below) instead of placeholders.
name: CI

on:
  push:
    branches: [b2b, main]
  pull_request:
    branches: [b2b, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository_owner == 'Indie-Kit'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"

      # Placeholders when secrets/vars unset (no `.env` in CI).
      DATABASE_URL: ${{ vars.CI_DATABASE_URL || 'postgresql://postgres:postgres@127.0.0.1:5432/ci' }}
      AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'ci-placeholder-auth-secret-32-characters!' }}
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET || 'ci-placeholder-session-secret-min-32-chars!' }}
      NEXTAUTH_URL: ${{ vars.CI_NEXTAUTH_URL || 'https://ci.example.invalid' }}
      NEXT_PUBLIC_APP_URL: ${{ vars.CI_NEXT_PUBLIC_APP_URL || 'https://ci.example.invalid' }}
      NEXT_PUBLIC_SIGNIN_ENABLED: "false"

      GOOGLE_CLIENT_ID: ${{ vars.CI_GOOGLE_CLIENT_ID || '000000000000-ci-placeholder.apps.googleusercontent.com' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.CI_GOOGLE_CLIENT_SECRET || 'ci-google-client-secret-placeholder' }}

      STRIPE_SECRET_KEY: ${{ secrets.CI_STRIPE_SECRET_KEY || 'sk_test_ci_placeholder_only' }}

      DODO_PAYMENTS_API_URL: ${{ vars.CI_DODO_PAYMENTS_API_URL || 'https://api.dodopayments.com' }}
      DODO_PAYMENTS_API_KEY: ${{ secrets.CI_DODO_PAYMENTS_API_KEY || 'ci_dodo_placeholder' }}

      AWS_REGION: ${{ vars.CI_AWS_REGION || 'us-east-1' }}
      AWS_BUCKET_NAME: ${{ vars.CI_AWS_BUCKET_NAME || 'ci-placeholder-bucket' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CI_AWS_ACCESS_KEY_ID || 'fake' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY || 'fake' }}

      LEMONSQUEEZY_API_KEY: ${{ secrets.CI_LEMONSQUEEZY_API_KEY || 'fake' }}

      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.CI_NEXT_PUBLIC_PAYPAL_CLIENT_ID || 'fake' }}
      PAYPAL_SECRET_KEY: ${{ secrets.CI_PAYPAL_SECRET_KEY || 'fake' }}
      NEXT_PUBLIC_PAYPAL_IS_SANDBOX: "true"

      NEXT_PUBLIC_PADDLE_ENV: "sandbox"
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${{ secrets.CI_NEXT_PUBLIC_PADDLE_CLIENT_TOKEN || 'test_placeholder_token' }}
      PADDLE_API_KEY: ${{ secrets.CI_PADDLE_API_KEY || 'ci_paddle_api_placeholder' }}
      PADDLE_WEBHOOK_SECRET: ${{ secrets.CI_PADDLE_WEBHOOK_SECRET || 'ci_paddle_webhook_placeholder' }}
      PADDLE_CREDITS_PRODUCT_ID: ${{ vars.CI_PADDLE_CREDITS_PRODUCT_ID || 'ci_paddle_credits_placeholder' }}

      POLAR_ACCESS_TOKEN: ${{ secrets.CI_POLAR_ACCESS_TOKEN || 'ci_polar_access_placeholder' }}
      POLAR_WEBHOOK_SECRET: ${{ secrets.CI_POLAR_WEBHOOK_SECRET || 'ci_polar_webhook_placeholder' }}
      POLAR_SERVER: "sandbox"
      POLAR_CREDITS_PRODUCT_ID: ${{ vars.CI_POLAR_CREDITS_PRODUCT_ID || 'ci_polar_credits_placeholder' }}

      SUPER_ADMIN_EMAILS: ${{ vars.CI_SUPER_ADMIN_EMAILS || 'admin@example.com' }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.15.1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
